{# app/templates/installments/_student_finance.html #}
<div class="card" style="margin-bottom:12px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <div style="font-weight:700; color:#0F172A;">اقساط دانشجو</div>
    <a class="btn btn-ghost" href="{{ url_for('installments.index') }}">مدیریت اقساط</a>
  </div>

  <div class="table-responsive">
    <table class="data-table" id="studentInstallmentsTable">
      <thead>
        <tr>
          <th>#</th>
          <th>عنوان برنامه</th>
          <th>دوره</th>
          <th>قسط</th>
          <th>سررسید</th>
          <th>اصل</th>
          <th>کارمزد چک</th>
          <th>جمع</th>
          <th>وضعیت</th>
          <th>اکشن</th>
        </tr>
      </thead>
      <tbody>
        <!-- با JS پر می‌شود -->
      </tbody>
    </table>
  </div>
</div>

<script>
(async function loadStudentInstallments(){
  try{
    // student_id را از #profile بخوان (از خود صفحه پروفایل)
    const hostEl = document.getElementById('profile');
    const studentId = Number(hostEl?.dataset.studentId || 0);
    if(!studentId){ return; }

    // ساخت آدرس API به‌صورت امن: /installments/student/0.json  →  /installments/student/<id>.json
    const baseUrl = "{{ url_for('installments.api_student_installments', student_id=0) }}";
    const apiUrl  = baseUrl.replace('/0.json', `/${studentId}.json`);

    const res = await fetch(apiUrl);
    if(!res.ok){ return; }
    const data = await res.json();

    const tbody = document.querySelector('#studentInstallmentsTable tbody');
    tbody.innerHTML = '';

    const rows = data.items || [];
    if(!rows.length){
      // طبق خواسته‌ات پیام «برنامه‌ی قسطی…» را نمایش نمی‌دهیم
      return;
    }

    rows.forEach((r, idx) => {
      const tr = document.createElement('tr');
      const paidCls = (r.status||'').toUpperCase()==='PAID' ? 'text-success' : 'text-danger';
      tr.innerHTML = `
        <td>${idx+1}</td>
        <td>${r.plan_title || '—'}</td>
        <td>${r.course_title || '—'}</td>
        <td>#${r.seq}</td>
        <td>${r.due_date || '—'}</td>
        <td>${(r.amount_base||0).toLocaleString('fa-IR')}</td>
        <td>${(r.cheque_fee_amount||0).toLocaleString('fa-IR')}</td>
        <td><strong>${(r.amount_total||0).toLocaleString('fa-IR')}</strong></td>
        <td class="${paidCls}">${r.status || 'PENDING'}</td>
        <td><a class="btn btn-primary btn-sm" href="${r.details_url}">جزئیات</a></td>
      `;
      tbody.appendChild(tr);
    });
  }catch(e){
    // silent fail
    console.error(e);
  }
})();
</script>
