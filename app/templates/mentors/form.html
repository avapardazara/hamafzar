{% extends "base.html" %}
{% if m %}
  {% set page_title = "ویرایش منتور" %}
{% else %}
  {% set page_title = "منتور جدید" %}
{% endif %}
{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="card" style="direction:rtl;">
  <div style="display:grid; grid-template-columns:160px 1fr; gap:20px; align-items:start;">
    <!-- Avatar -->
    <div>
      <label class="avatar-uploader" style="cursor:pointer; display:block; width:120px; height:120px; border-radius:50%; overflow:hidden; position:relative; background:#F3F4F6;">
        <img id="avatarPreview"
             src="{{ (m.avatar|avatar_url) if m else url_for('static','', filename='images/avatar-default.png') }}"
             style="width:100%; height:100%; object-fit:cover;"
             alt="">
        <input type="file" name="avatar" id="avatarInput" accept="image/*" style="display:none;">
      </label>
      <div class="muted" style="margin-top:8px;">تصویر پروفایل</div>
    </div>

    <!-- Fields -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div>
        <label>نام و نام خانوادگی</label>
        <input name="full_name" value="{{ m.full_name if m else '' }}" required>
      </div>
      <div>
        <label>ایمیل</label>
        <input name="email" value="{{ m.email if m else '' }}">
      </div>
      <div>
        <label>موبایل</label>
        <input name="phone" value="{{ m.phone if m else '' }}">
      </div>
    </div>
  </div>

  <div style="display:flex; gap:8px; margin-top:16px;">
    <button class="btn btn-primary" type="submit">ثبت</button>
    <a class="btn btn-ghost" href="{{ url_for('mentors.list') }}">بازگشت</a>
  </div>
</form>

<style>
  form.card input[type="text"], form.card input[type="email"], form.card input:not([type]) {
    width:100%; padding:10px; border:1px solid #D3D5DF; border-radius:8px;
  }
  form.card label { display:block; margin-bottom:6px; color:#334155; font-weight:600; }
</style>

<script>
  // پیش‌نمایش زنده
  const inp = document.getElementById('avatarInput');
  const img = document.getElementById('avatarPreview');
  document.querySelector('.avatar-uploader').addEventListener('click', () => inp.click());
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.readAsDataURL(f);
  });
</script>
{% endblock %}
